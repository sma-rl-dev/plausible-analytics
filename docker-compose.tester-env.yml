services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_DB: plausible_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plausible_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    network_mode: host
    environment:
      CLICKHOUSE_DB: plausible_events_db
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 30

  plausible:
    image: ${IMAGE_NAME:-tester-env-plausible-analytics:dev}
    network_mode: host
    build:
      context: .
      args:
        MIX_ENV: ce
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8032}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-plausible-tester-env-secret-key-base-000000000000000000000000000000}
      HTTP_PORT: ${PORT:-8032}
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/plausible_db
      CLICKHOUSE_DATABASE_URL: http://127.0.0.1:8123/plausible_events_db
      DISABLE_REGISTRATION: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@plausible.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-PlausibleTesterEnv123!}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

volumes:
  postgres-data:
  clickhouse-data:
